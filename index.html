<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Documentation for the SOUP platform">
  <title>SOUP — Documentation</title>
  <link rel="icon" href="assets/icon.png" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-button menu-button" id="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <a href="#/" class="brand"><span class="brand-logo"></span><span>SOUP Studio <span class="brand-muted">/ Docs</span></span></a>
    <span class="topbar-center">Documentation</span>
    <div class="top-actions"><button type="button" class="search-trigger" id="search-trigger"><span>⌕</span> Search docs <kbd>⌘ K</kbd></button><a class="github-link" id="github-link" href="https://github.com/soup-ocpm/soup" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GitHub ↗</a></div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
      <div class="sidebar-label">SOUP Documentation</div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-bottom"><span class="status-dot"></span> Lightweight static documentation <span class="side-version">v1</span></div>
    </aside>
    <div class="mobile-overlay" id="mobile-overlay"></div>
    <main class="content-wrap" id="main">
      <div class="content-inner">
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <article class="doc-content" id="article" aria-live="polite"><p>Loading documentation…</p></article>
        <div class="bottom-navigation" id="bottom-navigation"></div>
        <footer>SOUP Studio · Documentation</footer>
      </div>
    </main>
    <aside class="toc" aria-label="On this page"><div class="toc-heading">ON THIS PAGE</div><nav id="toc-links"></nav><a href="#/" class="toc-footer">↑ Documentation home</a></aside>
  </div>
  <div class="search-layer" id="search-layer" hidden>
    <div class="search-backdrop" id="search-backdrop"></div>
    <section class="search-dialog" role="dialog" aria-modal="true" aria-label="Search documentation">
      <div class="search-field"><span>⌕</span><input id="search-input" autocomplete="off" placeholder="Search SOUP documentation…" aria-label="Search documentation"><button id="search-close" type="button" aria-label="Close search">ESC</button></div>
      <div id="search-results" class="search-results" role="listbox"></div>
      <div class="search-hint">Search page titles and content · Enter to open</div>
    </section>
  </div>
</body>
</html>
